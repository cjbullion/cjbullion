<div id="lightbox" onclick="if(event.target===this)this.classList.remove('open')">
  <button type="button" onclick="document.getElementById('lightbox').classList.remove('open')" style="position:absolute;top:1rem;right:1rem;color:#fff;font-size:1.5rem;background:none;border:none;cursor:pointer">✕</button>
  <img class="main" id="lb-main" src="" alt="">
  <div class="thumbs" id="lb-thumbs"></div>
</div>

<script>
(function(){
  var loader = document.getElementById('cj-loader');
  var vid = document.getElementById('intro-vid');
  function hideLoader(){ if(loader) loader.classList.add('hide'); }
  if(vid){ vid.addEventListener('ended', hideLoader); vid.addEventListener('error', hideLoader); }
  setTimeout(hideLoader, 5000);

  window.openLB = function(srcs){
    var lb = document.getElementById('lightbox');
    var main = document.getElementById('lb-main');
    var thumbs = document.getElementById('lb-thumbs');
    function show(i){
      main.src = srcs[i];
      thumbs.innerHTML = '';
      srcs.forEach(function(s,j){
        var t = document.createElement('img');
        t.src = s;
        if(j===i) t.className = 'on';
        t.onclick = function(e){ e.stopPropagation(); show(j); };
        thumbs.appendChild(t);
      });
    }
    show(0);
    lb.classList.add('open');
  };

  var STOCK_URL = '/.netlify/functions/stock';
  var stock = {};
  var cart = [];
  var busy = false;

  function money(n){ return '$' + Number(n).toFixed(2); }
  function shipAmt(){
    if(!cart.length) return 0;
    var bars = cart.filter(function(i){ return i.id !== 'sticker'; }).length;
    if(bars === 0) return 2;
    return bars <= 4 ? 9 : 20;
  }
  function applySoldOut(){
    document.querySelectorAll('.add-btn').forEach(function(btn){
      var id = btn.getAttribute('data-id');
      if(id === 'sticker') return;
      if(typeof stock[id] === 'number' && stock[id] <= 0){
        btn.disabled = true;
        btn.textContent = 'Sold Out';
        btn.classList.add('opacity-50');
      }
    });
  }
  function loadStock(){
    fetch(STOCK_URL).then(function(r){ return r.json(); }).then(function(d){
      stock = d || {};
      applySoldOut();
    }).catch(function(){});
  }
  function render(){
    var count = cart.length;
    var badge = document.getElementById('cart-count');
    badge.textContent = count;
    if(count > 0) badge.classList.remove('hidden'); else badge.classList.add('hidden');
    document.getElementById('checkout-btn').disabled = count === 0;
    var box = document.getElementById('cart-items');
    if(!cart.length){
      box.innerHTML = '<p class="text-gray-500 text-center py-8">Your cart is empty</p>';
    } else {
      box.innerHTML = cart.map(function(i){
        return '<div class="flex justify-between py-3 border-b border-copper-900/30"><div><div class="font-medium">'+i.name+'</div><div class="text-sm text-gray-400">'+money(i.price)+'</div></div><div class="text-right"><div class="text-copper-300">'+money(i.price)+'</div><button type="button" class="rm text-xs text-red-400" data-id="'+i.id+'">Remove</button></div></div>';
      }).join('');
      box.querySelectorAll('.rm').forEach(function(b){
        b.onclick = function(){ cart = cart.filter(function(x){ return x.id !== b.getAttribute('data-id'); }); render(); };
      });
    }
    var sub = cart.reduce(function(s,i){ return s + i.price; }, 0);
    var sh = shipAmt();
    document.getElementById('cart-subtotal').textContent = money(sub);
    document.getElementById('cart-shipping').textContent = money(sh);
    document.getElementById('cart-total').textContent = money(sub + sh);
  }
  function openCart(){
    document.getElementById('cart-drawer').classList.remove('translate-x-full');
    document.getElementById('cart-overlay').classList.remove('hidden');
  }
  function closeCart(){
    document.getElementById('cart-drawer').classList.add('translate-x-full');
    document.getElementById('cart-overlay').classList.add('hidden');
  }
  function checkout(){
    if(busy || !cart.length) return;
    busy = true;
    var items = cart.map(function(i){ return { id: i.id, qty: 1 }; });
    var names = cart.map(function(i){ return i.name; }).join(', ');
    var total = cart.reduce(function(s,i){ return s + i.price; }, 0) + shipAmt();
    fetch(STOCK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: items })
    }).then(function(r){ return r.json(); }).then(function(d){
      if(d && d.stock){ stock = d.stock; applySoldOut(); }
    }).catch(function(){});
    var form = document.createElement('form');
    form.method = 'POST';
    form.action = 'https://www.paypal.com/cgi-bin/webscr';
    function add(n,v){ var i = document.createElement('input'); i.type = 'hidden'; i.name = n; i.value = v; form.appendChild(i); }
    add('cmd', '_xclick');
    add('business', 'cjbullions@yahoo.com');
    add('item_name', 'CJ Bullion: ' + names);
    add('amount', total.toFixed(2));
    add('currency_code', 'USD');
    add('no_shipping', '2');
    document.body.appendChild(form);
    form.submit();
  }

  document.querySelectorAll('.add-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-id');
      var name = btn.getAttribute('data-name');
      var price = Number(btn.getAttribute('data-price'));
      if(id !== 'sticker' && stock[id] === 0){ alert('Sold out.'); return; }
      if(cart.some(function(x){ return x.id === id; })){ alert('Already in cart — each bar is unique.'); openCart(); return; }
      cart.push({ id: id, name: name, price: price });
      render();
      openCart();
    });
  });
  document.getElementById('cart-btn').onclick = openCart;
  document.getElementById('close-cart').onclick = closeCart;
  document.getElementById('cart-overlay').onclick = closeCart;
  document.getElementById('checkout-btn').onclick = checkout;
  loadStock();
  render();
})();
</script>
</body>
</html>
